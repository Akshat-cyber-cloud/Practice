<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="forms">
        <h2 id="heading">Registration Forms</h2>

        <form id="form1">

            <label>Name:</label>
            <input id="name" placeholder="Enter Your Name">
            <span id="nameError"></span>

            <label>Email:</label>
            <input id="email" placeholder="Enter Your Mail" type="email">
            <span id="emailError"></span>

            <label>Password:</label>
            <input id="password" placeholder="Enter Your Password" type="password">
            <span id="passwordError"></span>

            <label>Confirm Password:</label>
            <input id="confirmPassword" placeholder="Re-Enter Your Password" type="password">
            <span id="confirmPasswordError"></span>

            <label>Age:</label>
            <input id="age" placeholder="Enter Your Age" type="number">
            <span id="ageError"></span>

            <button type="submit">Register</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
